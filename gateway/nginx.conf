# Gateway for the Handshake services (Pair 06).
# The host names (p06-student, p06-job, ...) are the Docker Compose service names, and also the
# Kubernetes Service names, so this one file works in both.

server {
    listen 9060;

    client_max_body_size 6m;       # resumes are at most 5 MB, plus the form around them
    proxy_read_timeout 600s;       # an assistant answer can take minutes on a CPU
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"p06-gateway","pair":"06"}';
    }

    # Applying belongs to the Application service even though the path starts with /jobs.
    # A regular-expression location is checked after the plain /jobs prefix below and wins for these two shapes.
    location ~ ^/jobs/[0-9]+/(apply|applications)$ { proxy_pass http://p06-application:9065; }
    location /jobs                                  { proxy_pass http://p06-job:9064; }
    location /meta                                  { proxy_pass http://p06-job:9064; }

    location /applications  { proxy_pass http://p06-application:9065; }
    location /events        { proxy_pass http://p06-event:9066; }
    location /assistant     { proxy_pass http://p06-assistant:9067; }
    location /companies     { proxy_pass http://p06-company:9063; }

    # Company signup is the only company-owned /auth path. Login, logout and /me work for both roles.
    location = /auth/company/signup { proxy_pass http://p06-company:9063; }
    location /auth                  { proxy_pass http://p06-student:9062; }
    location /students              { proxy_pass http://p06-student:9062; }
    location /media                 { proxy_pass http://p06-student:9062; }

    location / {
        default_type application/json;
        return 404 '{"detail":"Not Found"}';
    }
}
