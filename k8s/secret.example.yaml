# A TEMPLATE of the Secret the pods need. Do NOT put real values here and do NOT apply this file as it is.
# Create the real one from your git-ignored root .env with:   python k8s/create_secret.py
apiVersion: v1
kind: Secret
metadata:
  name: p06-secrets
  namespace: p06-handshake
type: Opaque
stringData:
  MONGO_USER: p06admin
  MONGO_PASSWORD: change-me-mongo-password
  JWT_SECRET: change-me-to-a-long-random-string
