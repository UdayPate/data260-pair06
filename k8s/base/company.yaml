# p06-company: company accounts and profiles. Port 9063.
apiVersion: v1
kind: Service
metadata:
  name: p06-company               # service discovery: other pods call http://p06-company:9063
  labels: {app: p06-company}
spec:
  selector: {app: p06-company}
  ports:
    - {name: http, port: 9063, targetPort: 9063}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p06-company
  labels: {app: p06-company}
spec:
  replicas: 1
  selector:
    matchLabels: {app: p06-company}
  template:
    metadata:
      labels: {app: p06-company}
    spec:
      enableServiceLinks: false      # do not inject a P06_*_SERVICE_HOST variable for every Service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001             # the user created in the Dockerfile
      containers:
        - name: company
          image: p06-company:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 9063}
          env:
            - name: MONGO_USER
              valueFrom: {secretKeyRef: {name: p06-secrets, key: MONGO_USER}}
            - name: MONGO_PASSWORD
              valueFrom: {secretKeyRef: {name: p06-secrets, key: MONGO_PASSWORD}}
            - name: MONGO_URL      # $(NAME) is replaced by Kubernetes with the variables defined above it
              value: mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@p06-mongo:27017/?authSource=admin
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: p06-secrets, key: JWT_SECRET}}
            - name: MONGO_DB_NAME
              valueFrom: {configMapKeyRef: {name: p06-config, key: MONGO_DB_NAME}}
            - name: CORS_ORIGINS
              valueFrom: {configMapKeyRef: {name: p06-config, key: CORS_ORIGINS}}
          startupProbe:              # gives a slow start up to 60 s before the other probes begin
            httpGet: {path: /health, port: 9063}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:             # "is the process alive?" (does not touch the database); on failure the pod is restarted
            httpGet: {path: /health, port: 9063}
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:            # "can it serve?" (pings MongoDB); on failure the pod gets no traffic
            httpGet: {path: /health/ready, port: 9063}
            periodSeconds: 10
            timeoutSeconds: 4
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
