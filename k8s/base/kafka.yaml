# Kafka: ONE broker in KRaft mode (no ZooKeeper), with a 2 GiB volume. Inside the cluster it is p06-kafka:9092.
# The topics (p06.*) are created by the first service or worker that needs them (automatic creation is off on purpose).
apiVersion: v1
kind: Service
metadata:
  name: p06-kafka
  labels: {app: p06-kafka}
spec:
  selector: {app: p06-kafka}
  ports:
    - {name: kafka, port: 9092, targetPort: 9092}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: p06-kafka
  labels: {app: p06-kafka}
spec:
  serviceName: p06-kafka
  replicas: 1
  selector:
    matchLabels: {app: p06-kafka}
  template:
    metadata:
      labels: {app: p06-kafka}
    spec:
      enableServiceLinks: false          # otherwise Kubernetes adds P06_KAFKA_* variables that Kafka does not need
      securityContext:
        fsGroup: 1000                    # the Kafka image runs as user 1000; the volume must be writable by it
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - {name: kafka, containerPort: 9092}
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "INTERNAL://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://p06-kafka:9092"}    # what clients are told to connect to
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "INTERNAL"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}         # the single node votes for itself
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m"}
          readinessProbe:
            exec: {command: ["/bin/sh", "-c", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket: {port: 9092}
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 2Gi}}
