# MongoDB: one pod with a 2 GiB volume (a StatefulSet keeps the pod's name and volume across restarts).
apiVersion: v1
kind: Service
metadata:
  name: p06-mongo            # the address the services use: p06-mongo:27017
  labels: {app: p06-mongo}
spec:
  selector: {app: p06-mongo}
  ports:
    - {name: mongo, port: 27017, targetPort: 27017}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: p06-mongo
  labels: {app: p06-mongo}
spec:
  serviceName: p06-mongo
  replicas: 1
  selector:
    matchLabels: {app: p06-mongo}
  template:
    metadata:
      labels: {app: p06-mongo}
    spec:
      enableServiceLinks: false
      containers:
        - name: mongo
          image: mongo:7
          args: ["--wiredTigerCacheSizeGB", "0.25"]     # keep MongoDB's cache small so it fits the limit below
          ports:
            - {name: mongo, containerPort: 27017}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: {secretKeyRef: {name: p06-secrets, key: MONGO_USER}}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: p06-secrets, key: MONGO_PASSWORD}}
          readinessProbe:
            exec: {command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]}
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          volumeMounts:
            - {name: data, mountPath: /data/db}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 2Gi}}
