# p06-event: events and registrations (publishes event.registration_created). Port 9066.
apiVersion: v1
kind: Service
metadata:
  name: p06-event               # service discovery: other pods call http://p06-event:9066
  labels: {app: p06-event}
spec:
  selector: {app: p06-event}
  ports:
    - {name: http, port: 9066, targetPort: 9066}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p06-event
  labels: {app: p06-event}
spec:
  replicas: 1
  selector:
    matchLabels: {app: p06-event}
  template:
    metadata:
      labels: {app: p06-event}
    spec:
      enableServiceLinks: false      # do not inject a P06_*_SERVICE_HOST variable for every Service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001             # the user created in the Dockerfile
      containers:
        - name: event
          image: p06-event:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 9066}
          env:
            - name: MONGO_USER
              valueFrom: {secretKeyRef: {name: p06-secrets, key: MONGO_USER}}
            - name: MONGO_PASSWORD
              valueFrom: {secretKeyRef: {name: p06-secrets, key: MONGO_PASSWORD}}
            - name: MONGO_URL      # $(NAME) is replaced by Kubernetes with the variables defined above it
              value: mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@p06-mongo:27017/?authSource=admin
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: p06-secrets, key: JWT_SECRET}}
            - name: MONGO_DB_NAME
              valueFrom: {configMapKeyRef: {name: p06-config, key: MONGO_DB_NAME}}
            - name: CORS_ORIGINS
              valueFrom: {configMapKeyRef: {name: p06-config, key: CORS_ORIGINS}}
            - name: KAFKA_BOOTSTRAP
              valueFrom: {configMapKeyRef: {name: p06-config, key: KAFKA_BOOTSTRAP}}
          startupProbe:              # gives a slow start up to 60 s before the other probes begin
            httpGet: {path: /health, port: 9066}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:             # "is the process alive?" (does not touch the database); on failure the pod is restarted
            httpGet: {path: /health, port: 9066}
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:            # "can it serve?" (pings MongoDB); on failure the pod gets no traffic
            httpGet: {path: /health/ready, port: 9066}
            periodSeconds: 10
            timeoutSeconds: 4
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
